# Feasibility-milestone configuration. Every number here is a provisional
# engineering setting, not a validated climbing or pose-quality standard.
# Detector thresholds are unvalidated hypotheses: tune on development data, freeze before held-out tests.
analysis:
  canonical_fps: 30
  inference_fps: 10            # must divide canonical_fps exactly
  longest_side_px: 1280
  max_duration_s: 120
  max_upload_mb: 250           # decimal megabytes (1 MB = 1,000,000 bytes)
pose_model:
  model_path: models/pose_landmarker_heavy.task
  manifest_path: config/model_manifest.json
  num_poses: 1
  min_pose_detection_confidence: 0.5   # MediaPipe documented default
  min_pose_presence_confidence: 0.5    # MediaPipe documented default
  min_tracking_confidence: 0.5         # MediaPipe documented default
  delegate: CPU
quality:
  min_visibility: 0.6
  min_presence_if_available: 0.6
  out_of_frame_margin: 0.0     # normalized units; 0 = must lie inside the image
  fill_missing_gaps: false     # the schema rejects true
  max_sample_gap_factor: 1.5   # consecutive samples farther apart break eligibility
  min_scale_samples: 10
  min_torso_fraction_of_diagonal: 0.02
  min_torso_ratio_to_attempt_scale: 0.5   # below this a whole pose is implausible (seen on public clips)
  max_torso_ratio_to_attempt_scale: 2.0
  camera_max_speed_L_per_s: 0.15          # estimated background speed above this breaks eligibility
  camera_min_correlation_response: 0.3    # weaker phase-correlation peaks are treated as unknown
features:
  smoothing_window_s: 0.3
  speed_window_s: 0.3
  min_speed_span_s: 0.1
low_movement:
  max_joint_speed_L_per_s: 0.15
  min_duration_s: 2.0
  max_fully_observed_interruption_s: 0.2
wrist_motion:
  onset_speed_L_per_s: 0.35
  offset_speed_L_per_s: 0.20
  offset_dwell_s: 0.25
  min_duration_s: 0.3
  min_displacement_L: 0.2
foot_motion:                   # left and right ankle anchors, gated separately; see docs/DECISIONS.md D50-D53
  onset_speed_L_per_s: 0.40
  offset_speed_L_per_s: 0.20
  offset_dwell_s: 0.25
  min_duration_s: 0.3
  min_displacement_L: 0.25
  unstable_shin_std_L: 0.07            # knee-to-ankle length swinging this much suggests a guessed ankle
  unstable_max_ankle_visibility: 0.9   # only when the model is also less sure of the ankle
  unstable_half_window_s: 0.45
  uncertain_min_fraction: 0.25         # share of an episode's samples that makes it uncertain
feasibility:
  low_movement_target_fraction: 0.70   # provisional target from docs/EVALUATION.md
